<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AGC Form Assistant - your answer bank</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; padding:32px 24px 64px; background:#0f172a; color:#e2e8f0;
           font-family:-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.55; }
    main { max-width:760px; margin:0 auto; }
    h1 { font-size:22px; margin:0 0 4px; color:#f8fafc; }
    .sub { color:#94a3b8; margin:0 0 28px; }
    h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:#94a3b8;
         margin:32px 0 12px; font-weight:600; }
    section { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:18px 20px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button { padding:8px 14px; font-size:13px; font-weight:600; border:1px solid #334155;
             border-radius:7px; background:#0f172a; color:#e2e8f0; cursor:pointer; }
    button:hover { background:#334155; }
    button.primary { background:#38bdf8; border-color:#38bdf8; color:#04263a; }
    button.primary:hover { background:#7dd3fc; }
    textarea { width:100%; height:220px; margin-top:12px; font-family:ui-monospace,Consolas,monospace;
               font-size:12px; background:#020617; color:#cbd5e1; border:1px solid #334155;
               border-radius:8px; padding:12px; resize:vertical; }
    textarea:focus { outline:none; border-color:#38bdf8; }
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px; }
    .stat b { display:block; font-size:22px; color:#38bdf8; }
    .stat span { font-size:12px; color:#94a3b8; }
    .msg { margin-top:14px; padding:10px 12px; border-radius:8px; font-size:13px; }
    .msg.err { background:#450a0a; border:1px solid #7f1d1d; color:#fecaca; }
    .msg.warn { background:#3f2d09; border:1px solid #78500a; color:#fde68a; }
    .msg.ok { background:#052e23; border:1px solid #10603f; color:#a7f3d0; }
    .msg ul { margin:6px 0 0; padding-left:18px; }
    .themes { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .theme { font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid #334155;
             background:#0f172a; color:#94a3b8; }
    .theme.on { color:#34d399; border-color:#10603f; }
    .theme.off { color:#fbbf24; border-color:#78500a; }
    .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:4px 18px;
              margin-top:10px; font-size:12.5px; }
    .fields div { color:#64748b; }
    .fields div.set { color:#cbd5e1; }
    .fields b { color:#f1f5f9; font-weight:600; }
    p.hint { color:#94a3b8; font-size:12.5px; margin:10px 0 0; }
    code { background:#020617; padding:1px 5px; border-radius:4px; font-size:12px; color:#7dd3fc; }
  </style>
</head>
<body>
<main>
  <h1>Your answer bank</h1>
  <p class="sub">Everything the assistant knows about you. It stays on this computer and is never sent anywhere.</p>

  <section id="status">
    <div class="stat-grid" id="stats"></div>
    <div class="themes" id="coverage"></div>
    <div class="fields" id="profile"></div>
    <div class="row" style="margin-top:18px">
      <button id="export">Download bank</button>
      <button id="forget">Forget remembered answers</button>
      <button id="clear">Remove bank</button>
    </div>
  </section>

  <h2>Load or replace</h2>
  <section>
    <div class="row">
      <button class="primary" id="save">Save what is below</button>
      <button id="pick">Open a .json file</button>
      <button id="example">Load the example bank</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Paste your bank JSON here"></textarea>
    <p class="hint">Built from a story intake, not from a resume: <code>node intake/plan.mjs resume.txt --scaffold bank.json</code></p>
    <div id="messages"></div>
  </section>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
